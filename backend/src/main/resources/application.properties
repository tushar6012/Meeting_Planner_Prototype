spring.application.name=meeting-planner
server.port=8080

# H2 Database Settings
spring.datasource.url=jdbc:h2:mem:meetingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Multipart Upload configurations (for avatar upload)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration (min 256 bits secret)
app.jwt.secret=9a67a86c6731f82247b6d13543d8a74e50d1880460c877bb86b86d9a1c890786
app.jwt.expiration-ms=86400000
